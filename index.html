<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f9f8f5" />
    <meta
      name="description"
      content="Interactive Globe with Live Clouds: 固定ドットの色で海・大地・雲を描き、ドラッグ操作で回転できる地球儀。"
    />
    <title>Interactive Globe with Live Clouds</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <a class="brand" href="./" aria-label="Interactive Globe with Live Clouds ホーム">
          <span class="brand-mark" aria-hidden="true"
            ><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i
          ></span>
          Interactive Globe with Live Clouds
        </a>
      </header>

      <main>
        <section class="hero" aria-label="操作できるドット地球儀">
          <div class="globe-column">
            <div class="stage" id="globe-stage">
              <canvas
                id="globe"
                tabindex="0"
                role="img"
                aria-label="固定されたドットの色で回転を表す地球儀。ドラッグや矢印キーで回転、スペースキーで自動回転を切り替えます。"
                >この地球儀の表示には Canvas 対応ブラウザーが必要です。</canvas
              >
              <div class="loading-message" id="loading-message">
                世界を描いています<span>…</span>
              </div>
            </div>
          </div>
        </section>

        <section class="controls" aria-label="地球儀の設定">
          <div class="control-block motion-control">
            <div class="control-heading">
              <span class="control-number">01</span><span>モーション</span>
            </div>
            <div class="control-content">
              <div class="control-description">
                <strong>自動回転</strong
                ><span id="rotation-description">最後に動かした方向へ</span>
              </div>
              <button
                id="auto-rotate"
                class="toggle"
                type="button"
                role="switch"
                aria-checked="true"
                aria-label="自動回転"
              >
                <span></span>
              </button>
            </div>
          </div>
          <div class="control-block speed-control">
            <div class="control-heading">
              <label for="speed"
                ><span class="control-number">02</span>回転スピード</label
              ><output id="speed-value" for="speed">1.0×</output>
            </div>
            <div class="range-wrap">
              <span>ゆっくり</span
              ><input
                id="speed"
                type="range"
                min="0.25"
                max="2"
                step="0.05"
                value="1"
                aria-valuetext="1.0倍"
              /><span>はやく</span>
            </div>
          </div>
          <div class="control-block display-control">
            <div class="control-heading">
              <span><span class="control-number">03</span>地表と雲</span
              ><button
                id="reset"
                class="reset-button"
                type="button"
                title="表示と回転を初期状態に戻す"
              >
                <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                  <path d="M3 8a7 7 0 1 1 1 7M3 3v5h5" /></svg
                >リセット
              </button>
            </div>
            <div class="display-options">
              <ul class="surface-legend" aria-label="地表の色の目安">
                <li>
                  <span class="legend-ocean" aria-hidden="true"></span>海洋
                </li>
                <li>
                  <span class="legend-vegetation" aria-hidden="true"></span>植生
                </li>
                <li>
                  <span class="legend-desert" aria-hidden="true"></span>砂漠
                </li>
                <li><span class="legend-ice" aria-hidden="true"></span>氷雪</li>
              </ul>
              <div class="overlay-options">
                <label class="grid-label"
                  ><input id="show-clouds" type="checkbox" checked /><span
                    class="custom-checkbox"
                    aria-hidden="true"
                  ></span
                  >雲を表示</label
                >
                <label class="grid-label"
                  ><input id="show-grid" type="checkbox" /><span
                    class="custom-checkbox"
                    aria-hidden="true"
                  ></span
                  >経緯線を表示</label
                >
              </div>
            </div>
          </div>
        </section>

        <p class="cloud-meta">
          <span id="cloud-status" role="status">雲データを読み込み中</span>
          <a id="cloud-source-link" target="_blank" rel="noreferrer" hidden
            >データの出典 <span aria-hidden="true">↗</span></a
          >
        </p>
      </main>

      <footer class="site-footer">
        <span>A SMALL EXPERIMENT. A WHOLE WORLD.</span
        ><span
          >地図データ
          <a
            href="https://www.naturalearthdata.com/about/terms-of-use/"
            target="_blank"
            rel="noreferrer"
            >Natural Earth <span aria-hidden="true">↗</span></a
          ></span
        >
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
